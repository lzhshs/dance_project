name: sim
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.8
  - numpy=1.24
  - scipy
  - pip
  - pip:
    - mujoco>=3.1.0
    - smplx
    - transforms3d
    - trimesh
    - mediapy
    - opencv-python
    - tqdm
    - matplotlib
    - librosa
    - soundfile
